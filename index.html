<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fishery Quiz & Catch - เกมตกปลาและทายสายพันธุ์ปลา</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4">

  <!-- Header -->
  <header class="w-full max-w-4xl flex items-center justify-between bg-slate-800/80 backdrop-blur border border-slate-700 p-3 sm:p-4 rounded-2xl shadow-lg mb-3">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-teal-500/20 text-teal-400 rounded-xl border border-teal-500/30">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-base sm:text-xl font-bold text-teal-300">Fishery Quiz & Catch</h1>
        <p class="text-xs text-slate-400">ตกปลา & เรียนรู้สายพันธุ์สัตว์น้ำ</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="text-right">
        <div class="text-xs text-slate-400">คะแนนรวม</div>
        <div id="scoreText" class="text-lg font-bold text-amber-400">0 XP</div>
      </div>
      <button onclick="togglePedia()" class="p-2 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-1.5 transition">
        <span>📖</span>
        <span class="hidden sm:inline">สมุดสะสม</span>
      </button>
    </div>
  </header>

  <!-- Main Game Area -->
  <main class="w-full max-w-4xl flex-1 flex flex-col gap-4">
    
    <!-- Fishing Viewport (Canvas) -->
    <div class="relative w-full bg-slate-900 rounded-2xl border border-slate-700 shadow-2xl overflow-hidden min-h-[300px] sm:min-h-[380px] flex flex-col">
      <div class="absolute top-3 left-3 z-10 bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full border border-slate-700 text-xs text-teal-400 font-medium">
        จุดตกปลา: แหล่งน้ำธรรมชาติ
      </div>
      <div id="statusBadge" class="absolute top-3 right-3 z-10 bg-amber-500/20 text-amber-300 backdrop-blur px-3 py-1 rounded-full border border-amber-500/30 text-xs font-medium">
        พร้อมออกตกปลา
      </div>

      <canvas id="fishCanvas" class="w-full h-full flex-1 cursor-pointer"></canvas>

      <!-- Fishing Control Bar -->
      <div class="p-3 sm:p-4 bg-slate-800/90 border-t border-slate-700 flex flex-col gap-2">
        <div class="flex justify-between text-xs sm:text-sm font-medium text-slate-300">
          <span>จังหวะวัดเบ็ด</span>
          <span id="timingStatus" class="text-amber-400">กดปุ่มเพื่อเริ่มตกปลา</span>
        </div>
        
        <!-- Timing Meter Bar -->
        <div class="relative w-full h-6 bg-slate-950 rounded-full border border-slate-700 overflow-hidden">
          <div id="greenZone" class="absolute top-0 bottom-0 bg-emerald-500/50 border-x-2 border-emerald-400" style="left: 40%; width: 25%;"></div>
          <div id="meterPointer" class="absolute top-0 bottom-0 w-2 bg-yellow-300 shadow-[0_0_8px_#fde047]" style="left: 0%;"></div>
        </div>

        <button id="actionBtn" onclick="handleActionButton()" class="w-full py-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-base rounded-xl transition shadow-lg shadow-teal-500/20 active:scale-[0.99]">
          🎣 หย่อนสายเบ็ด
        </button>
      </div>
    </div>

  </main>

  <!-- Quiz Modal Window -->
  <div id="quizModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-5 shadow-2xl flex flex-col gap-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
      
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-teal-400">ปลาติดเบ็ดแล้ว!</span>
          <h2 class="text-lg sm:text-xl font-bold text-white">ทายสายพันธุ์สัตว์น้ำ</h2>
        </div>
        <span class="text-2xl">🐟</span>
      </div>

      <!-- Fish Silhouette / Vector Preview -->
      <div class="w-full h-36 bg-slate-900 rounded-xl border border-slate-700 flex items-center justify-center p-2 relative overflow-hidden">
        <div id="quizFishImage" class="w-full h-full flex items-center justify-center"></div>
      </div>

      <!-- Quiz Hint -->
      <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 text-xs sm:text-sm text-slate-300">
        <span class="text-teal-400 font-bold">💡 คำใบ้ทางประมง: </span>
        <span id="quizHintText">กำลังโหลดคำใบ้...</span>
      </div>

      <!-- Answer Options Grid -->
      <div id="quizOptions" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>

      <!-- Result Banner (Shows correct / incorrect with details) -->
      <div id="quizResultBanner" class="hidden p-3 rounded-xl border text-xs sm:text-sm flex flex-col gap-1"></div>

      <!-- Close / Continue Button -->
      <button id="modalCloseBtn" onclick="closeQuizModal()" class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-semibold text-sm transition hidden">
        ตกปลาตัวต่อไป 🎣
      </button>

    </div>
  </div>

  <!-- Fishpedia Modal -->
  <div id="pediaModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-2xl w-full p-5 shadow-2xl flex flex-col gap-4 max-h-[85vh]">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">📖 สารานุกรมสัตว์น้ำ (Fishpedia)</h2>
        <button onclick="togglePedia()" class="text-slate-400 hover:text-white text-xl">✕</button>
      </div>
      
      <div id="pediaList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 overflow-y-auto custom-scrollbar pr-1 flex-1"></div>
    </div>
  </div>

  <!-- Game Logic Script -->
  <script>
    // --- Data: Fish Species Knowledge Base ---
    const FISH_DATABASE = [
      {
        id: "tilapia",
        name: "ปลานิล",
        sciName: "Oreochromis niloticus",
        type: "ปลาน้ำจืด",
        habitat: "บ่อเลี้ยง, แม่น้ำ, ลำคลอง",
        hint: "มีลำตัวข้างแบน มีแถบสีดำคั่นตามยาวลำตัวและครีบหาง นำเข้าโดยในหลวงรัชกาลที่ 9 จากประเทศญี่ปุ่น",
        color: "#94a3b8",
        svg: `<svg viewBox="0 0 100 60" class="w-32 h-20"><ellipse cx="50" cy="30" rx="35" ry="20" fill="#64748b"/><path d="M15 30 L5 15 L5 45 Z" fill="#475569"/><polygon points="35,10 65,10 55,20" fill="#475569"/><circle cx="70" cy="25" r="3" fill="#000"/><line x1="30" y1="15" x2="30" y2="45" stroke="#334155" stroke-width="2"/><line x1="45" y1="12" x2="45" y2="48" stroke="#334155" stroke-width="2"/><line x1="60" y1="15" x2="60" y2="45" stroke="#334155" stroke-width="2"/></svg>`
      },
      {
        id: "catfish",
        name: "ปลาดุกอุย",
        sciName: "Clarias batrachus",
        type: "ปลาน้ำจืด",
        habitat: "หนอง บึง นาข้าว",
        hint: "ลำตัวยาว ไม่มีเกล็ด มีหนวด 4 คู่รอบปาก ใช้ช่วยในการรับสัมผัสในน้ำขุ่น สามารถหายใจด้วยอวัยวะพิเศษได้",
        color: "#334155",
        svg: `<svg viewBox="0 0 100 60" class="w-32 h-20"><path d="M20 30 Q50 15 80 28 Q85 30 80 32 Q50 45 20 30 Z" fill="#334155"/><path d="M20 30 L5 20 L5 40 Z" fill="#1e293b"/><line x1="75" y1="28" x2="90" y2="20" stroke="#000" stroke-width="1.5"/><line x1="75" y1="32" x2="90" y2="40" stroke="#000" stroke-width="1.5"/><line x1="78" y1="29" x2="92" y2="25" stroke="#000" stroke-width="1.5"/><line x1="78" y1="31" x2="92" y2="35" stroke="#000" stroke-width="1.5"/><circle cx="75" cy="25" r="2.5" fill="#facc15"/></svg>`
      },
      {
        id: "seabass",
        name: "ปลากะพงขาว",
        sciName: "Lates calcarifer",
        type: "ปลาสองน้ำ (น้ำเค็ม/น้ำกร่อย)",
        habitat: "ชายฝั่ง, ป่าชายเลน, ปากแม่น้ำ",
        hint: "ลำตัวหนา หัวแหลม ตาโตสีเหลืองทอง ครีบหลังแบ่งเป็นสองส่วน มีความสำคัญทางเศรษฐกิจสูงมาก",
        color: "#cbd5e1",
        svg: `<svg viewBox="0 0 100 60" class="w-32 h-20"><ellipse cx="50" cy="30" rx="38" ry="18" fill="#94a3b8"/><path d="M12 30 L2 18 L2 42 Z" fill="#64748b"/><polygon points="30,12 55,12 45,22" fill="#475569"/><polygon points="60,12 75,12 70,22" fill="#475569"/><circle cx="75" cy="24" r="3.5" fill="#facc15"/><circle cx="75" cy="24" r="1.5" fill="#000"/></svg>`
      },
      {
        id: "giant_catfish",
        name: "ปลาบึก",
        sciName: "Pangasianodon gigas",
        type: "ปลาน้ำจืดขนาดใหญ่",
        habitat: "แม่น้ำโขง",
        hint: "ปลาน้ำจืดไม่มีเกล็ดขนาดใหญ่ที่สุดในโลก ไม่มีฟัน และไม่มีหนวดเมื่อโตเต็มวัย กินพืชและตะไคร่น้ำเป็นอาหาร",
        color: "#64748b",
        svg: `<svg viewBox="0 0 100 60" class="w-32 h-20"><ellipse cx="50" cy="30" rx="42" ry="22" fill="#475569"/><path d="M8 30 L-2 15 L-2 45 Z" fill="#334155"/><polygon points="40,8 60,8 52,20" fill="#334155"/><circle cx="80" cy="32" r="3" fill="#000"/></svg>`
      },
      {
        id: "blackchin",
        name: "ปลาหมอคางดำ",
        sciName: "Sarotherodon melanotheron",
        type: "เอเลี่ยนสปีชีส์ (Invasive)",
        habitat: "แหล่งน้ำกร่อย และน้ำจืดชายฝั่ง",
        hint: "สายพันธุ์ต่างถิ่นที่มีจุดสีดำใต้คาง ปรับตัวและขยายพันธุ์รวดเร็ว ฟักไข่ในปาก กำลังส่งผลกระทบต่อระบบนิเวศไทย",
        color: "#a3e635",
        svg: `<svg viewBox="0 0 100 60" class="w-32 h-20"><ellipse cx="50" cy="30" rx="32" ry="19" fill="#84cc16"/><path d="M18 30 L5 18 L5 42 Z" fill="#65a30d"/><path d="M62 38 Q67 42 72 38 Z" fill="#0f172a"/><circle cx="72" cy="24" r="3" fill="#000"/></svg>`
      }
    ];

    // --- State Variables ---
    let score = 0;
    let caughtSet = new Set();
    let gameState = "IDLE"; // IDLE, WAITING, HOOKING, QUIZ
    let targetPointerPos = 0;
    let pointerDirection = 1;
    let greenZoneStart = 35;
    let greenZoneWidth = 25;
    let currentFish = null;
    let animFrame = null;
    let bobberY = 0;
    let waveOffset = 0;

    // --- Canvas Setup ---
    const canvas = document.getElementById("fishCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener("resize", resizeCanvas);

    // --- Drawing Fishing Viewport ---
    function drawScene() {
      resizeCanvas();
      const w = canvas.width;
      const h = canvas.height;
      const waterY = h * 0.45;

      ctx.clearRect(0, 0, w, h);

      // Sky Background
      const skyGradient = ctx.createLinearGradient(0, 0, 0, waterY);
      skyGradient.addColorStop(0, "#0f172a");
      skyGradient.addColorStop(1, "#1e293b");
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, w, waterY);

      // Water Background
      const waterGradient = ctx.createLinearGradient(0, waterY, 0, h);
      waterGradient.addColorStop(0, "#0891b2");
      waterGradient.addColorStop(1, "#0f172a");
      ctx.fillStyle = waterGradient;
      ctx.fillRect(0, waterY, w, h - waterY);

      // Waves
      waveOffset += 0.05;
      ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
      ctx.beginPath();
      ctx.moveTo(0, waterY);
      for (let x = 0; x <= w; x += 20) {
        ctx.lineTo(x, waterY + Math.sin(x * 0.03 + waveOffset) * 4);
      }
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fill();

      // Fishing Rod & Line & Hook
      const rodStartX = w * 0.15;
      const rodStartY = h * 0.35;
      const rodTipX = w * 0.65;
      const rodTipY = h * 0.15;

      // Draw Fishing Rod (คันเบ็ด)
      ctx.strokeStyle = "#b45309";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(rodStartX, rodStartY);
      ctx.quadraticCurveTo(w * 0.4, h * 0.2, rodTipX, rodTipY);
      ctx.stroke();

      // Fishing Line (สายเบ็ด)
      let lineTargetY = waterY + 10;
      if (gameState === "WAITING" || gameState === "HOOKING") {
        lineTargetY = waterY + 25 + Math.sin(waveOffset * 2) * 3;
      }
      
      if (gameState !== "IDLE") {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(rodTipX, rodTipY);
        ctx.lineTo(rodTipX, lineTargetY);
        ctx.stroke();

        // Bobber / Float (ทุ่นลอย)
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(rodTipX, lineTargetY - 4, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(rodTipX, lineTargetY + 2, 6, 0, Math.PI * 2);
        ctx.fill();

        // Hook (ตัวเบ็ดใต้น้ำ)
        const hookY = lineTargetY + 45;
        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(rodTipX, lineTargetY);
        ctx.lineTo(rodTipX, hookY);
        ctx.arc(rodTipX - 4, hookY, 4, 0, Math.PI, false);
        ctx.stroke();
      }

      // Fish Silhouette Under Water
      if (gameState === "WAITING" || gameState === "HOOKING") {
        const fishX = rodTipX + Math.sin(waveOffset) * 30;
        const fishY = waterY + 50 + Math.cos(waveOffset) * 10;
        
        ctx.fillStyle = "rgba(15, 23, 42, 0.5)";
        ctx.beginPath();
        ctx.ellipse(fishX, fishY, 20, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Meter Pointer Loop Animation
      if (gameState === "HOOKING") {
        targetPointerPos += 1.8 * pointerDirection;
        if (targetPointerPos >= 100 || targetPointerPos <= 0) {
          pointerDirection *= -1;
        }
        document.getElementById("meterPointer").style.left = targetPointerPos + "%";
      }

      animFrame = requestAnimationFrame(drawScene);
    }

    // --- Button Action Handler ---
    function handleActionButton() {
      const btn = document.getElementById("actionBtn");
      const badge = document.getElementById("statusBadge");
      const statusText = document.getElementById("timingStatus");

      if (gameState === "IDLE") {
        // Start Casting Line
        gameState = "WAITING";
        btn.innerText = "⏳ รอปลากินเหยื่อ...";
        btn.disabled = true;
        btn.className = "w-full py-3 bg-slate-700 text-slate-400 font-bold text-base rounded-xl cursor-not-allowed";
        badge.innerText = "หย่อนเหยื่อลงน้ำแล้ว...";
        badge.className = "absolute top-3 right-3 z-10 bg-blue-500/20 text-blue-300 backdrop-blur px-3 py-1 rounded-full border border-blue-500/30 text-xs font-medium";

        // Random Fish Strike Delay (2 - 4 Seconds)
        setTimeout(() => {
          if (gameState === "WAITING") {
            gameState = "HOOKING";
            // Randomize Green Zone Position
            greenZoneStart = 20 + Math.floor(Math.random() * 50);
            document.getElementById("greenZone").style.left = greenZoneStart + "%";
            document.getElementById("greenZone").style.width = greenZoneWidth + "%";

            btn.disabled = false;
            btn.innerText = "🎣 ฮุก! (กดเพื่อวัดเบ็ด)";
            btn.className = "w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-base rounded-xl transition shadow-lg shadow-amber-500/20 animate-pulse";
            badge.innerText = "🐟 FISH ON! ปลากินเหยื่อแล้ว!";
            badge.className = "absolute top-3 right-3 z-10 bg-red-500/30 text-red-300 backdrop-blur px-3 py-1 rounded-full border border-red-500/50 text-xs font-bold animate-bounce";
            statusText.innerText = "กดให้ตรงแถบสีเขียว!";
          }
        }, 2000 + Math.random() * 2000);

      } else if (gameState === "HOOKING") {
        // Hook Pressed - Check Precision
        const isHit = targetPointerPos >= greenZoneStart && targetPointerPos <= (greenZoneStart + greenZoneWidth);
        
        if (isHit) {
          // Success Hook -> Open Quiz
          triggerQuiz();
        } else {
          // Missed Hook
          statusText.innerText = "❌ วัดเบ็ดพลาด! ปลาหลุดไปแล้ว";
          resetGame();
        }
      }
    }

    function resetGame() {
      gameState = "IDLE";
      const btn = document.getElementById("actionBtn");
      const badge = document.getElementById("statusBadge");

      btn.disabled = false;
      btn.innerText = "🎣 หย่อนสายเบ็ด";
      btn.className = "w-full py-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-base rounded-xl transition shadow-lg shadow-teal-500/20 active:scale-[0.99]";
      badge.innerText = "พร้อมออกตกปลา";
      badge.className = "absolute top-3 right-3 z-10 bg-amber-500/20 text-amber-300 backdrop-blur px-3 py-1 rounded-full border border-amber-500/30 text-xs font-medium";
    }

    // --- Quiz Logic ---
    function triggerQuiz() {
      gameState = "QUIZ";
      currentFish = FISH_DATABASE[Math.floor(Math.random() * FISH_DATABASE.length)];

      document.getElementById("quizHintText").innerText = currentFish.hint;
      document.getElementById("quizFishImage").innerHTML = currentFish.svg;

      // Prepare Multiple Choice Options (1 Correct + 3 Random Distractors)
      const options = [currentFish];
      while (options.length < 4) {
        const rand = FISH_DATABASE[Math.floor(Math.random() * FISH_DATABASE.length)];
        if (!options.find(o => o.id === rand.id)) {
          options.push(rand);
        }
      }
      options.sort(() => Math.random() - 0.5);

      const optionsContainer = document.getElementById("quizOptions");
      optionsContainer.innerHTML = "";
      
      options.forEach(opt => {
        const optBtn = document.createElement("button");
        optBtn.className = "p-3 bg-slate-700/80 hover:bg-slate-600 border border-slate-600 rounded-xl text-sm font-medium text-left transition flex items-center justify-between";
        optBtn.innerHTML = `<span>${opt.name}</span><span class="text-xs text-slate-400">${opt.type}</span>`;
        optBtn.onclick = () => submitAnswer(opt.id, optBtn);
        optionsContainer.appendChild(optBtn);
      });

      document.getElementById("quizResultBanner").className = "hidden";
      document.getElementById("modalCloseBtn").classList.add("hidden");
      document.getElementById("quizModal").classList.remove("hidden");
    }

    function submitAnswer(selectedId, btnElement) {
      // Disable all option buttons
      const buttons = document.querySelectorAll("#quizOptions button");
      buttons.forEach(b => b.disabled = true);

      const banner = document.getElementById("quizResultBanner");
      banner.classList.remove("hidden");

      if (selectedId === currentFish.id) {
        // Correct Answer
        score += 100;
        caughtSet.add(currentFish.id);
        document.getElementById("scoreText").innerText = score + " XP";

        btnElement.className = "p-3 bg-emerald-600 border border-emerald-400 rounded-xl text-sm font-bold text-white text-left flex items-center justify-between";
        
        banner.className = "p-3 bg-emerald-500/20 border border-emerald-500/40 rounded-xl text-xs sm:text-sm text-emerald-300 flex flex-col gap-1";
        banner.innerHTML = `
          <div class="font-bold text-base">🎉 ถูกต้องครับ! ได้รับ +100 XP</div>
          <div>นี่คือ <span class="font-bold text-white">${currentFish.name}</span> (<em>${currentFish.sciName}</em>)</div>
          <div class="text-xs text-slate-300 font-normal">บันทึกข้อมูลลงในสมุดสะสมสัตว์น้ำเรียบร้อยแล้ว!</div>
        `;
      } else {
        // Incorrect Answer -> Show Reveal Solution
        btnElement.className = "p-3 bg-rose-600 border border-rose-400 rounded-xl text-sm font-bold text-white text-left flex items-center justify-between";

        banner.className = "p-3 bg-rose-500/20 border border-rose-500/40 rounded-xl text-xs sm:text-sm text-rose-300 flex flex-col gap-1";
        banner.innerHTML = `
          <div class="font-bold text-base">❌ ยังไม่ถูกต้อง!</div>
          <div>คำตอบที่ถูกต้องคือ: <span class="font-bold text-amber-300">${currentFish.name}</span></div>
          <div class="text-xs text-slate-300">ชื่อวิทยาศาสตร์: <em>${currentFish.sciName}</em></div>
          <div class="text-xs text-slate-400 mt-1">ถิ่นอาศัย: ${currentFish.habitat}</div>
        `;
      }

      document.getElementById("modalCloseBtn").classList.remove("hidden");
      renderPedia();
    }

    function closeQuizModal() {
      document.getElementById("quizModal").classList.add("hidden");
      resetGame();
    }

    // --- Fishpedia Rendering ---
    function renderPedia() {
      const container = document.getElementById("pediaList");
      container.innerHTML = "";

      FISH_DATABASE.forEach(fish => {
        const isCaught = caughtSet.has(fish.id);
        const card = document.createElement("div");
        card.className = `p-3 rounded-xl border flex gap-3 items-center ${
          isCaught 
            ? "bg-slate-700/60 border-teal-500/40" 
            : "bg-slate-900/50 border-slate-800 opacity-60"
        }`;

        card.innerHTML = `
          <div class="w-16 h-12 bg-slate-900 rounded-lg flex items-center justify-center border border-slate-700 flex-shrink-0">
            ${isCaught ? fish.svg : '<span class="text-xl">❓</span>'}
          </div>
          <div class="flex-1">
            <div class="flex items-center justify-between">
              <h4 class="font-bold text-sm ${isCaught ? 'text-teal-300' : 'text-slate-400'}">${isCaught ? fish.name : '???'}</h4>
              <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">${fish.type}</span>
            </div>
            <p class="text-xs text-slate-400 italic">${isCaught ? fish.sciName : 'ยังไม่เคยตกได้'}</p>
            ${isCaught ? `<p class="text-[11px] text-slate-300 mt-1 line-clamp-2">${fish.hint}</p>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function togglePedia() {
      const modal = document.getElementById("pediaModal");
      modal.classList.toggle("hidden");
      if (!modal.classList.contains("hidden")) {
        renderPedia();
      }
    }

    // --- Init Application ---
    drawScene();
    renderPedia();
  </script>
</body>
</html>
